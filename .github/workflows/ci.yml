name: CI

on:
  push:
    branches: [master, 3.0]
  pull_request:
    branches: [master, 3.0]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java 构建 (JDK 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: 编译
        run: mvn -q -DskipTests compile

      - name: 打包
        run: mvn -q -DskipTests package -pl assembly -am

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: mos-dist
          path: assembly/target/mos-*/
          retention-days: 7

  cli:
    name: mos-cli 测试 (Node 18)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mos-cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: mos-cli/package-lock.json

      - run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 测试
        run: npm test

      - name: 校验打包内容
        run: npm pack --dry-run

  java-compat:
    name: Java SDK 签名兼容性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: 编译 Java SDK
        run: |
          mvn -q -DskipTests compile -pl mos-base,mos-sdk -am

      - name: 交叉验证签名
        working-directory: mos-cli
        run: |
          npm ci
          npm run build
          bash scripts/verify-java-compat.sh
