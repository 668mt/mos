name: 功能需求
description: 提议新功能或对现有功能的改进
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述使用场景，而不只是解决方案
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: 涉及模块
      options:
        - mos-server
        - mos-client
        - mos-sdk
        - mos-sdk-spring-boot-starter
        - mos-cli
        - 运维 / 部署
        - 文档
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他方案
