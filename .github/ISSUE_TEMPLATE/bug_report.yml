name: Bug 报告
description: 报告 MOS 的功能异常或缺陷
labels: ["bug", "需要复现"]
body:
  - type: textarea
    id: version
    attributes:
      label: MOS 版本
      placeholder: "3.0（分支 3.0）"
    validations:
      required: true

  - type: textarea
    id: module
    attributes:
      label: 涉及模块
      options:
        - mos-server（服务端）
        - mos-client（存储节点）
        - mos-sdk（Java SDK）
        - mos-sdk-spring-boot-starter
        - mos-cli（命令行）
        - 其他 / 不确定
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: 运行环境
      description: JDK、MySQL、Redis 版本
      render: text
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 编号列出操作步骤
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 粘贴相关日志片段（logs/mos-server.log 或 logs/mos-client.log）
      render: shell
